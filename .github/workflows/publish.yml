name: Publish

# Publishes both artifacts from a single git tag, using OIDC only — there is no
# long-lived secret anywhere in this workflow.
#
# One-time setup on npmjs.com, otherwise the npm step fails:
#   Package mcp-immo-olv → Settings → Trusted publishing → GitHub Actions
#     Organization or user : OlivierLAVAUD
#     Repository           : mcp-immo-olv
#     Workflow filename    : publish.yml
#     Environment name     : (leave empty)
#     Allowed actions      : allow "npm publish" (not only staged publishes)
#
# The MCP Registry side needs no configuration: `login github-oidc` verifies the
# GitHub Actions OIDC token, which is why the server name lives in the
# io.github.OlivierLAVAUD/ namespace.
#
# If the registry step fails while npm is still processing the release, re-run it
# without republishing: Actions -> Publish -> Run workflow, with `registry_only`
# checked. The registry validates the npm version against registry.npmjs.org, and
# npm serves a fresh release asynchronously.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      registry_only:
        description: >-
          Skip npm publish (the version is already on npm) and only (re)publish
          to the MCP Registry
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required by both OIDC exchanges below

jobs:
  publish:
    name: npm + MCP Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 ships an npm new enough for trusted publishing
      # (requires npm >= 11.5.1 and Node >= 22.14.0).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in a release build

      - name: Check the tag against package.json, server.json and the plugin manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          srv="$(node -p "require('./server.json').version")"
          plug="$(node -p "require('./.claude-plugin/plugin.json').version")"
          echo "tag=$tag  package.json=$pkg  server.json=$srv  plugin.json=$plug"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          if [ "$tag" != "$srv" ]; then
            echo "::error::tag v$tag does not match server.json version $srv"
            exit 1
          fi
          if [ "$tag" != "$plug" ]; then
            echo "::error::tag v$tag does not match .claude-plugin/plugin.json version $plug"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # The plugin is fetched from GitHub: a release whose manifest is invalid or
      # out of sync would pin Claude Code users to a broken version.
      - name: Validate the Claude Code plugin manifests
        # Pinned locale: the CLI is third-party, its messages stay unlocalized.
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict

      - name: Publish to npm
        if: ${{ inputs.registry_only != true }}
        run: npm publish

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        # The registry rejects a version npm has not started serving yet, and npm
        # answers a fresh publish with "being processed and may take a few
        # minutes". Retry with backoff rather than failing the release on that
        # window; the last attempt is the one that reports the error.
        run: |
          for attempt in $(seq 1 8); do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "::warning::MCP Registry publish attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "::error::MCP Registry publish failed after 8 attempts"
          exit 1
